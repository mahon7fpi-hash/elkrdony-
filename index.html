ntent="ابحث عن نتيجتك برقم المسلسل والاسم، وتصفّح لوحة الشرف"><meta property="og:image" content="og-image.png"><meta name="twitter:card" content="summary_large_image">
<style>
:root{--red:#d32f2f;--red2:#ff6659;--blue:#1565c0;--blue2:#5e92f3;--bg:#eef2fb;--card:#fff;--tx:#14213d;--mut:#5b6785;--bd:#d8e0f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1326;--card:#172042;--tx:#eef1fb;--mut:#a3aed0;--bd:#2a3768;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1326;--card:#172042;--tx:#eef1fb;--mut:#a3aed0;--bd:#2a3768;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;min-height:100vh;background-image:radial-gradient(circle at 10% 0,rgba(211,47,47,.18),transparent 40%),radial-gradient(circle at 90% 10%,rgba(21,101,192,.22),transparent 45%)}
header{padding:28px 16px 10px;text-align:center;perspective:700px}
.cube{width:54px;height:54px;margin:0 auto 14px;position:relative;transform-style:preserve-3d;animation:spin 9s linear infinite}
.cube i{position:absolute;top:0;right:0;bottom:0;left:0;border:2px solid #fff3;display:block}
.cube i:nth-child(1){background:var(--red);transform:translateZ(27px)}.cube i:nth-child(2){background:var(--blue);transform:rotateY(180deg) translateZ(27px)}
.cube i:nth-child(3){background:#b71c1c;transform:rotateY(90deg) translateZ(27px)}.cube i:nth-child(4){background:#0d47a1;transform:rotateY(-90deg) translateZ(27px)}
.cube i:nth-child(5){background:var(--red2);transform:rotateX(90deg) translateZ(27px)}.cube i:nth-child(6){background:var(--blue2);transform:rotateX(-90deg) translateZ(27px)}
@keyframes spin{to{transform:rotateX(-25deg) rotateY(360deg)}}
h1{margin:0;font-size:32px;font-size:clamp(26px,5vw,42px);color:var(--blue);text-shadow:1px 1px 0 var(--red),2px 2px 0 var(--red),3px 3px 0 #0003,4px 5px 8px #0004}
.sub{color:var(--mut);margin:8px 0 0}
nav .btn{margin:4px}nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:14px}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;color:#fff;background:linear-gradient(180deg,var(--blue2),var(--blue));box-shadow:0 5px 0 #0d3c7a,0 9px 14px #0003;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0d3c7a}
.btn.r{background:linear-gradient(180deg,var(--red2),var(--red));box-shadow:0 5px 0 #8e1b1b,0 9px 14px #0003}.btn.r:active{box-shadow:0 1px 0 #8e1b1b}
.btn.g{background:var(--card);color:var(--tx);box-shadow:0 4px 0 var(--bd),0 7px 12px #0002}
.btn.on{outline:3px solid var(--red)}.btn.s{padding:6px 12px;font-size:13px;box-shadow:0 3px 0 #0d3c7a;margin:4px 2px 8px}
main{max-width:980px;margin:0 auto;padding:0 14px 50px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;margin:0 0 18px;box-shadow:0 18px 30px -12px #0005,0 2px 0 #fff4 inset;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 24px 34px -12px #0006,0 2px 0 #fff4 inset}
label{display:block;font-weight:700;margin:12px 0 6px;font-size:14px}
input,select{width:100%;font:inherit;padding:11px 13px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx)}
input:focus,select:focus{outline:0;border-color:var(--blue)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.msg{padding:12px 14px;border-radius:12px;margin:12px 0;font-weight:600}.err{background:#d32f2f22;color:var(--red)}.ok{background:#1565c022;color:var(--blue)}
.big{font-size:56px;font-weight:800;color:var(--red);text-shadow:2px 2px 0 var(--blue2);line-height:1}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--blue);color:#fff;font-weight:700;font-size:13px;margin:2px}.pill.r{background:var(--red)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th{color:var(--blue)}
.podium{display:flex;gap:14px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin:14px 0}
.pod{margin:7px;flex:1;min-width:150px;max-width:230px;text-align:center;padding:16px 10px;border-radius:16px;color:#fff;background:linear-gradient(160deg,var(--blue2),var(--blue));box-shadow:0 10px 0 #0d3c7a,0 16px 22px #0004;transform:rotateX(8deg)}
.pod.p1{background:linear-gradient(160deg,var(--red2),var(--red));box-shadow:0 10px 0 #8e1b1b,0 16px 22px #0004;padding-bottom:34px}
.pod b{display:block;font-size:30px}.h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hide{display:none!important}
#cert{position:fixed;top:0;right:0;bottom:0;left:0;background:#000b;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.cert{background:#fffdf5;color:#14213d;width:min(760px,100%);padding:34px 28px;text-align:center;border:12px double var(--blue);outline:6px solid var(--red);outline-offset:-26px;border-radius:6px}
.cert h2{font-size:34px;margin:0 0 10px;color:var(--red)}.cert .nm{font-size:34px;font-weight:800;color:var(--blue);margin:14px 0;border-bottom:3px solid var(--red);display:inline-block;padding:0 24px}
.cert p{font-size:18px;margin:8px 0}.cert .sig{display:flex;justify-content:space-between;margin-top:34px;font-weight:700}

  $("#app").innerHTML=`<div class="card"><h2 style="margin-top:0">الإعدادات</h2>${S.note?`<div class="msg ${S.note.t}">${esc(S.note.m)}</div>`:""}<div class="row"><div><label>عنوان البوابة</label><input id="st" value="${esc(s.title)}"></div><div><label>اسم المعلم (يظهر في الشهادة)</label><input id="sa" value="${esc(s.teacher)}"></div><div><label>نسبة النجاح %</label><input id="sp" type="number" value="${s.pass}"></div><div><label>عدد الأوائل المكرَّمين</label><input id="sn" type="number" min="1" max="20" value="${s.topN}"></div></div><label><input type="checkbox" id="m1" ${s.modeSerial!==false?"checked":""} style="width:auto"> السماح للطالب بالبحث برقم المسلسل فقط</label><label><input type="checkbox" id="m2" ${s.modeName!==false?"checked":""} style="width:auto"> السماح للطالب بالبحث بالاسم فقط (إن تكرر الاسم يُطلب منه المسلسل)</label><p><button class="btn r" id="ss">حفظ الإعدادات</button></p></div>${ED==="teacher"?ACC():`<div class="card"><h3 style="margin-top:0">قاعدة بيانات مركزية (للنشر الفوري)</h3><label>رابط قاعدة البيانات (Firebase Realtime Database)</label><input id="cu" value="${esc(URLB)}" placeholder="https://xxxx-default-rtdb.firebasedatabase.app" dir="ltr"><label>مفتاح الواجهة Web API Key (ليس سريًا)</label><input id="ck" value="${esc(KEY)}" dir="ltr"><label>بريد المعلم (المستخدم الذي أنشأته في Authentication)</label><input id="ce" type="email" value="${esc(AU.st().email||"")}" dir="ltr" autocomplete="username"><label>كلمة المرور</label><input id="cp" type="password" dir="ltr" autocomplete="current-password"><p><button class="btn" onclick="saveCfg()">تسجيل الدخول وحفظ</button> <button class="btn g s" onclick="testConn()">اختبار الاتصال</button>${AU.ok()?` <button class="btn r s" onclick="logoutCfg()">تسجيل الخروج</button>`:""}</p><div id="ctr">${AU.ok()?`<div class="msg ok">مسجَّل الدخول: ${esc(AU.st().email||"")}</div>`:""}</div><p class="sub">لا تعطِ ملف المعلم ولا بريدك وكلمة مرورك للطلاب أبدًا؛ ملف الطلاب لا يحتوي أي بيانات دخول. لإضافة مشرف: أنشئ له مستخدمًا في Firebase Authentication وأضف بريده إلى القواعد.</p></div>`}`;
  $("#ss").onclick=async()=>{const d={title:$("#st").value||"بوابة نتائج الامتحانات",teacher:$("#sa").value||"المعلم",pass:+$("#sp").value||50,topN:Math.max(1,Math.min(20,+$("#sn").value||3)),modeSerial:$("#m1").checked,modeName:$("#m2").checked,photo:S.set.photo||""};
    try{await DB.put("settings",d);Object.assign(S.set,d);S.note={t:"ok",m:"تم حفظ الإعدادات."}}catch(x){S.note={t:"err",m:"فشل الحفظ: "+errMsg(x)}}render()};
}

  const out=js.replace('const MODE="teacher";',()=>'const MODE="student";').replace('const EMBED=null;',()=>"const EMBED="+data+";").replace(/const CFG=\{[^}]*\};/,()=>"const CFG="+JSON.stringify({url:URLB,apiKey:""})+";").replace(/<\/script/gi,"<\\/script");
  return '<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>'+esc(S.set.title)+'</title>'+[...document.querySelectorAll('head link[rel*="icon"],head meta[name="theme-color"],head meta[property^="og:"],head meta[name="twitter:card"]')].map(e=>e.outerHTML).join('')+'<style>'+document.querySelector("style").textContent+'</style></head><body><header><div class="hrow"><div class="ava hide" id="ava"></div><svg class="hero" viewBox="0 0 640 240" role="img" aria-label="كتاب وقبعة تخرج وكأس وشهادة"><defs><linearGradient id="hB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5e92f3"/><stop offset="1" stop-color="#1565c0"/></linearGradient><linearGradient id="hR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6659"/><stop offset="1" stop-color="#d32f2f"/></linearGradient><linearGradient id="hG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe082"/><stop offset=".55" stop-color="#ffca28"/><stop offset="1" stop-color="#f9a825"/></linearGradient><radialGradient id="hGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5e92f3" stop-opacity=".45"/><stop offset="1" stop-color="#5e92f3" stop-opacity="0"/></radialGradient><filter id="hSh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#0d1b4c" flood-opacity=".28"/></filter></defs><ellipse cx="320" cy="118" rx="300" ry="112" fill="url(#hGlow)"/><ellipse cx="320" cy="222" rx="245" ry="11" fill="#0d1b4c" opacity=".16"/><g fill="#ffca28"><path d="M70 40l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z" opacity=".9"/><path d="M590 34l4 9 10 1-8 7 2 10-9-5-9 5 2-10-8-7 10-1z" opacity=".9"/><circle cx="168" cy="30" r="4"/><circle cx="478" cy="26" r="3.5"/><circle cx="36" cy="132" r="3"/><circle cx="612" cy="140" r="3.5"/></g><g filter="url(#hSh)"><path d="M136 126v70c62-10 124-8 184 14 60-22 122-24 184-14v-70z" fill="url(#hB)"/><path d="M320 206c-58-22-118- hG)"/><path d="M526 84h12v54c-8-6-12-18-12-30z" fill="#fff" opacity=".35"/><path d="M550 98l5 10 11 2-8 8 2 11-10-6-10 6 2-11-8-8 11-2z" fill="#fff" opacity=".95"/><rect x="543" y="154" width="14" height="26" fill="#f9a825"/><rect x="520" y="178" width="60" height="12" rx="4" fill="url(#hR)"/><rect x="508" y="188" width="84" height="16" rx="5" fill="url(#hB)"/></g></svg></div><h1 id="ttl"></h1><p class="sub">ابحث عن نتيجتك برقم المسلسل والاسم</p></header><nav id="nav"></nav><main id="app"></main><div id="cert" class="hide"></div><script>'+out+'<\/script></body></html>';
}
function cert(id,serial){
  const e=S.exams.find(x=>x.id===id),r=e&&ranks(e).find(x=>x.s===serial);if(!r)return;
  const w=["","الأول","الثاني","الثالث"][r.k]||"ضمن الأوائل";
  const html=`<div class="cert">${ILL.seal}<h2>🎓 شهادة تقدير وتكريم</h2><p>تتشرف إدارة ${esc(S.set.title)}</p><p>بتكريم الطالب/ة</p><div class="nm">${esc(r.n)}</div><p>لحصوله على المركز <b>${w}</b> في ${esc(e.name)}</p><p>بدرجة <b>${r.v} / ${e.max}</b> وتقدير <b>${grade(r.v,e.max)}</b></p><p>متمنين له دوام التفوق والنجاح</p><div class="sig"><span>التاريخ: ${dateS()}</span><span>المعلم: ${esc(S.set.teacher)}</span></div></div>`;
  const c=$("#cert");c.classList.remove("hide");
  c.innerHTML=`<div>${html}<p class="np" style="text-align:center"><button class="btn r" id="pr">🖨️ طباعة</button> <button class="btn" id="dl">⬇️ تحميل</button> <button class="btn g" id="cl">إغلاق</button></p></div>`;
  $("#cl").onclick=()=>c.classList.add("hide");$("#pr").onclick=()=>window.print();
  $("#dl").onclick=async()=>{try{const d=await claude.use("downloads");await d.save({filename:`certificate-${r.s}.html`,data:new Blob([`<!DOCTYPE html><html lang="ar" dir="rtl"><meta charset="utf-8"><body style="font-family:Tahoma;text-align:center;padding:30px">${html.replace(/<div class="cert">/,'<div style="border:12px double #1565c0;padding:30px;max-width:760px;margin:auto">')}</body></html>`],{type:"text/html"})})}catch(x){}}
}
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("button");if(!b)return;const D=b.dataset;
  if(D.tab){S.tab=D.tab;S.note=null;S.res=null;if(!S.admin||D.tab==="s"||D.tab==="h"){const L=S.exams.filter(e=>e.published);if(!L.find(e=>e.id===S.sel))S.sel=""}render()}
  else if(D.qm){S.qm=D.qm;S.res=null;S.q={s:"",n:""};render()}
  else if(D.cert){const[a,...r]=D.cert.split("|");cert(a,r.join("|"))}
  else if(D.pub){const e=S.exams.find(x=>x.id===D.pub);try{await DB.put("exams/"+e.id+"/published",!e.published);S.sig="";await pull();S.note={t:"ok",m:e.published?"تم إخفاء الامتحان.":"تم النشر، النتيجة متاحة للطلاب الآن."}}catch(x){S.note={t:"err",m:"فشل التحديث: "+errMsg(x)}}render()}
  else if(D.del){if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="تأكيد الحذف؟";return}try{await DB.del("exams/"+D.del);S.sig="";await pull();S.note={t:"ok",m:"تم الحذف."}}catch(x){S.note={t:"err",m:"فشل الحذف: "+errMsg(x)}}render()}
  else if(D.act==="pubfile"){if(!S.exams.some(e=>e.published)){S.note={t:"err",m:"لا توجد امتحانات منشورة. انشر امتحانًا أولًا ثم صدّر الملف."};return render()}try{const d=await claude.use("downloads");await d.save({filename:"student.html",data:new Blob([studentHtml()],{type:"text/html"})});S.note={t:"ok",m:URLB?"تم تنزيل ملف الطالب. سيقرأ النتائج المنشورة من قاعدة البيانات تلقائيًا؛ لا تحتاج لإعادة إرسال الملف عند تحديث النتائج، بشرط رفعه مرة واحدة على رابط ثابت/استضافة.":"تم تنزيل ملف الطالب كنسخة ثابتة. بدون قاعدة بيانات مركزية لا يمكن تحديثه تلقائيًا عبر أجهزة مختلفة؛ يلزم ربط قاعدة بيانات ثم نشر الملف مرة واحدة على رابط ثابت."}}catch(x){S.note={t:"err",m:"فشل التصدير"}}render()}
  else if(D.xlsx){const e=S.exams.find(x=>x.id===D.xlsx);if(!e)return;const rows=[["الترتيب","المسلسل","الاسم","الدرجة","التقدير"],...ranks(e).map(r=>[r.k,r.s,r.n,r.v,grade(r.v,e.max)])],filename=(e.name.replace(/[\\/:*?"<>|]+/g,"-").trim()||"results");let fallback=false;if(window.XLSX){try{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),"النتائج");XLSX.writeFile(wb,filename+".xlsx")}catch(x){fallback=true}}else fallback=true;if(fallback){S.note={t:"err",m:"مكتبة Excel غير متاحة؛ تم تنزيل CSV بديل يفتح في Excel."};const csv="\ufeff"+rows.map(row=>row.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=filename+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);render()}}
  else if(D.print){const e=S.exams.find(x=>x.id===D.print);if(e){const rows=ranks(e).map(r=>`<tr><td>${r.k}</td><td>${esc(r.s)}</td><td>${esc(r.n)}</td><td>${r.v}</td><td>${grade(r.v,e.max)}</td></tr>`).join("");const w=window.open("","_blank");if(w){w.document.write(`<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>${esc(e.name)}</title><style>body{font-family:Tahoma,Arial;padding:20px}h1{text-align:center}table{width:100%;border-collapse:collapse}td,th{border:1px solid #888;padding:8px;text-align:right}@media print{button{display:none}}</style><h1>${esc(e.name)}</h1><p>${esc(S.set.title)} — ${esc(S.set.teacher)}</p><table><tr><th>الترتيب</th><th>المسلسل</th><th>الاسم</th><th>الدرجة</th><th>التقدير</th></tr>${rows}</table><button onclick="print()">طباعة / حفظ PDF</button></html>`);w.document.close()}}}
  else if(D.exp){const e=S.exams.find(x=>x.id===D.exp),csv="\ufeff"+["المسلسل,الاسم,الدرجة,التقدير,الترتيب",...ranks(e).map(r=>[r.s,r.n,r.v,grade(r.v,e.max),r.k].map(c=>`"${String(c).replace(/"/g,'""')}"`).join(","))].join("\n");
    try{const d=await claude.use("downloads");await d.save({filename:(e.name.replace(/[\\/:*?"<>|]+/g,"-").trim()||"results")+".csv",data:new Blob([csv],{type:"text/csv"})})}catch(x){}}
});
document.addEventListener("change",ev=>{if(ev.target.id==="fx"&&S.tab==="h"){S.sel=ev.target.value;render()}});
saveCfg=async()=>{const url=$("#cu").value.trim().replace(/\/+$/,""),key=$("#ck").value.trim(),em=$("#ce").value.trim().toLowerCase(),pw=$("#cp").value,out=m=>{$("#ctr").innerHTML=m};
  if(!url||!key||!em||!pw)return out(`<div class="msg err">أكمل الحقول الأربعة: الرابط، مفتاح الواجهة، البريد، كلمة المرور.</div>`);
  out(`<div class="msg ok">جارٍ تسجيل الدخول…</div>`);
  try{await AU.login(em,pw,key)}catch(x){return out(`<div class="msg err">تعذر تسجيل الدخول: ${esc(errMsg(x))}</div>`)}
  try{localStorage.setItem("rp_cfg",JSON.stringify({url,apiKey:key}))}catch(e){}
  location.reload()};
function logoutCfg(){AU.out();location.reload()}
async function testConn(){const u=$("#cu").value.trim().replace(/\/+$/,""),out=m=>{$("#ctr").innerHTML=m},bad=(t,x)=>out(`<div class="msg err">${t}: ${esc(errMsg(x))}</div>`);
  if(!u)return out(`<div class="msg err">اكتب رابط قاعدة البيانات أولًا.</div>`);
  let t;try{t=await AU.token()}catch(x){return bad("لم تسجّل الدخول (اضغط تسجيل الدخول وحفظ أولًا)",x)}
  try{const r=await fetch(u+"/.json?auth="+encodeURIComponent(t));if(!r.ok)throw new Error("HTTP "+r.status);await r.json()}catch(x){return bad("فشلت قراءة المعلم",x)}
  try{const r=await fetch(u+"/ping.json?auth="+encodeURIComponent(t),{method:"PUT",body:JSON.stringify(Date.now())});if(!r.ok)throw new Error("HTTP "+r.status)}catch(x){return bad("القراءة تعمل لكن الكتابة فشلت",x)}
  try{const r=await fetch(u+"/public.json");if(!r.ok)throw new Error("HTTP "+r.status);await r.json()}catch(x){return bad("قراءة الطلاب لمسار public فشلت (راجع القواعد)",x)}
  out(`<div class="msg ok">✅ الاتصال سليم: المعلم يقرأ ويكتب، والطلاب يقرؤون مسار public فقط. أعد تصدير ملف الطلاب مرة واحدة.</div>`)}
async function pull(){if(ED==="teacher"&&MODE==="teacher"&&!AU.ok())return;
  try{const d=await DB.get()||{},ex=Object.values(d.exams||{}).filter(e=>e&&e.rows).sort((x,y)=>y.ts-x.ts),sig=JSON.stringify([ex,d.settings]),first=!S.loaded,down=!S.db;S.db=true;S.err="";S.upd=new Date();if(MODE==="teacher"&&URLB&&AU.ok()){const pub={exams:Object.fromEntries(ex.filter(e=>e.published).map(e=>[e.id,e])),settings:d.settings||S.set,updatedAt:Date.now()};const ps=JSON.stringify(pub);if(ps!==S.pubSig){try{await DB.put("public",pub);S.pubSig=ps;S.syncWarn=""}catch(syncErr){S.syncWarn="تعذر تحديث نسخة الطلاب تلقائيًا: "+errMsg(syncErr)+(ED==="teacher"?"":". راجع صلاحيات قاعدة البيانات.")}}}
    if(sig!==S.sig){S.sig=sig;S.exams=ex;if(d.settings)Object.assign(S.set,d.settings);S.loaded=true;if(first||down||!(document.activeElement&&document.activeElement.matches&&document.activeElement.matches("input,select")))render()}else if(first||down){S.loaded=true;render()}
  }catch(x){const was=S.db;S.db=false;S.err=errMsg(x);if(!S.loaded||was){S.loaded=true;render()}}
}
(()=>{S.db=true;render();pull();let busy=false;const sync=async()=>{if(busy||document.visibilityState==="hidden")return;busy=true;try{await pull()}finally{busy=false}};if(URLB||(!EMBED&&MODE!=="teacher"))setInterval(sync,5000);addEventListener("storage",e=>{if(e.key===LK)sync()});addEventListener("online",sync);addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sync()})})();
</script>
